locale: tr-TR
title: Bahadır Doğru
title_separator: "·"
name: Bahadır Doğru
description: Açık kaynak araçlar, masaüstü uygulamalar ve teknik notlar.
url: https://bahadirdogru.com
baseurl: ""

author:
  avatar: profile.png
  name: Bahadır Doğru
  bio: Açık kaynak araçlar, masaüstü uygulamalar ve teknik notlar.
  location: İstanbul
  email: iletisim@bahadirdogru.com
  github: bahadirdogru
  gitlab: bahadirdogru
  twitter: bhdrd
  linkedin: bahadirdogru

twitter:
  username: bhdrd

words_per_minute: 180
future: false

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: single }
  - scope: { path: "", type: pages }
    values: { layout: single }
  - scope: { path: "", type: portfolio }
    values: { layout: single }

permalink: /:title/

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
  - jekyll-gist

include:
  - _pages

exclude:
  - changelog.md
  - LICENSE.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - IYILESTIRME_ONERILERI.md
  - vendor
  - serve.sh
  - start.sh
  - install.sh
  - markdown_generator
  - talkmap
  - site
  - _draft
  - node_modules
  - .jekyll-cache
