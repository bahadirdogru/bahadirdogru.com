{%- if include.icon -%}<img class="mark" src="{{ include.icon }}" width="{{ include.px | default: 22 }}" height="{{ include.px | default: 22 }}" alt="">{%- else -%}<svg class="mark" viewBox="0 0 32 32" width="{{ include.px | default: 22 }}" height="{{ include.px | default: 22 }}" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><text x="16" y="22.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="var(--bg)">{{ include.letter | default: "B" }}</text></svg>{%- endif -%}
